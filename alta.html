<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://pifswbumwcuqpvneqtbh.supabase.co; connect-src https://pifswbumwcuqpvneqtbh.supabase.co https://api.pwnedpasswords.com; media-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tu tarjeta de sellos</title>
<link rel="stylesheet" href="vendor/fuentes/fuentes.css">
<style>
  /* Mismo estilo «liquid glass» que el panel de Punch, con los colores de cada negocio (negocios.color_*) */
  :root{
    --fondo:#0b0a1a; --texto:#f5f4ff; --acento:#7c5cff;
    --suave:color-mix(in srgb,var(--texto) 70%,transparent); --tenue:color-mix(in srgb,var(--texto) 45%,transparent);
    --vidrio:rgba(255,255,255,.08); --filo:rgba(255,255,255,.22); --brillo:rgba(255,255,255,.5); --campo:rgba(255,255,255,.06);
    --error:#ff8f8f;
    --display:"Bricolage Grotesque","SF Pro Display",system-ui,sans-serif;
    --cuerpo:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color-scheme:dark;
  }
  :root.claro{--vidrio:rgba(255,255,255,.55);--filo:rgba(255,255,255,.75);--brillo:rgba(255,255,255,.9);--campo:rgba(255,255,255,.6);--error:#b3261e;color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--fondo);color:var(--texto);font:16px/1.5 var(--cuerpo);-webkit-font-smoothing:antialiased}
  body{overflow-x:hidden}
  [hidden]{display:none!important}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--acento);outline-offset:3px}

  .orbes{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .orbes i{position:absolute;border-radius:50%;filter:blur(60px);animation:flotar 18s ease-in-out infinite alternate}
  .orbes i:nth-child(1){width:55vmax;height:55vmax;left:-20vmax;top:-22vmax;background:var(--acento);opacity:.45}
  .orbes i:nth-child(2){width:42vmax;height:42vmax;right:-16vmax;top:24vh;background:color-mix(in srgb,var(--acento) 55%,#ffffff);opacity:.25;animation-duration:23s}
  .orbes i:nth-child(3){width:48vmax;height:48vmax;left:8vw;bottom:-30vmax;background:color-mix(in srgb,var(--acento) 60%,#000000);opacity:.4;animation-duration:27s}
  @keyframes flotar{to{transform:translate(6vmax,4vmax) scale(1.08)}}

  .vidrio{position:relative;background:var(--vidrio);border:1px solid var(--filo);border-radius:24px;
    backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
    box-shadow:inset 0 1px 0 var(--brillo),0 20px 50px rgba(3,2,15,.35)}
  .vidrio::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.05))}

  main{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;
    padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    display:flex;flex-direction:column;gap:18px}

  .cab{display:flex;align-items:center;justify-content:center;min-height:52px}
  .cab img{height:46px;max-width:200px;object-fit:contain}
  .cab .nombre{font:800 26px/1.1 var(--display);letter-spacing:-.01em;text-align:center}

  .hero{text-align:center;display:grid;gap:8px}
  h1{margin:0;font:800 30px/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance}
  .sub{margin:0;color:var(--suave);text-wrap:balance}

  /* Vista previa de la tarjeta, flotando */
  .tarjeta{border-radius:20px;overflow:hidden;border:1px solid var(--filo);background:var(--fondo-tarjeta,var(--fondo));
    box-shadow:0 24px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);transform:rotate(-2deg);animation:flotarTarjeta 6s ease-in-out infinite alternate}
  @keyframes flotarTarjeta{to{transform:rotate(1deg) translateY(-6px)}}
  .tarjeta .tit{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px;color:var(--texto-tarjeta,var(--texto))}
  .tarjeta .tit img{height:26px;max-width:120px;object-fit:contain}
  .tarjeta .tit b{font-size:15px}
  .tarjeta .tit .contador{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--acento)}
  .tarjeta > img{display:block;width:100%;height:auto}
  .tarjeta .pie{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;color:var(--texto-tarjeta,var(--texto))}
  .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--acento)}
  .v{font-size:15px;font-weight:500}
  .pie div:last-child{text-align:right}

  .formulario{padding:20px;display:grid;gap:14px}
  label.campo{display:grid;gap:6px;font-weight:600;font-size:14px;color:var(--suave)}
  label.campo small{font-weight:400;color:var(--tenue)}
  input[type=text],input[type=tel]{width:100%;padding:14px 15px;border-radius:14px;border:1px solid var(--filo);background:var(--campo);color:var(--texto);font-size:16px;font-weight:400;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
  input::placeholder{color:var(--tenue)}
  input[type=text]:focus,input[type=tel]:focus{outline:none;border-color:var(--acento);box-shadow:0 0 0 4px color-mix(in srgb,var(--acento) 22%,transparent)}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:var(--suave);cursor:pointer}
  .check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--acento)}
  .boton{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:16px;padding:15px 16px;font-weight:600;font-size:17px;cursor:pointer;transition:transform .15s ease}
  .boton:active{transform:scale(.97)}
  .boton svg{width:22px;height:22px;flex:none}
  .apple{background:#000;color:#fff;border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px rgba(0,0,0,.35)}
  .google{background:#fff;color:#1f1f1f;border:1px solid rgba(0,0,0,.08);box-shadow:0 10px 24px rgba(0,0,0,.25)}
  .boton:disabled{opacity:.55;cursor:default}
  .aviso{border-radius:16px;padding:12px 14px;font-size:14px;color:var(--suave)}
  .error{color:var(--error);font-size:14px;min-height:1.2em;margin:0}

  /* Estado final: la tarjeta entra en la cartera */
  .listo{padding:24px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
  .listo .cartera{position:relative;width:96px;height:80px}
  .listo .cartera .c{position:absolute;left:14px;right:14px;top:0;height:44px;border-radius:10px;background:var(--acento);box-shadow:0 8px 18px rgba(0,0,0,.3);animation:meter .8s .15s cubic-bezier(.5,0,.3,1) forwards}
  .listo .cartera .w{position:absolute;inset:auto 0 0;height:52px;border-radius:14px;background:var(--texto);opacity:.9}
  @keyframes meter{to{transform:translateY(26px)}}
  .listo strong{font:800 22px/1.2 var(--display)}
  .listo span{color:var(--suave)}

  .conpunch{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--tenue);text-decoration:none}
  .conpunch svg{width:15px;height:15px;color:var(--suave)}
  .conpunch b{font:400 16px "Instrument Serif",Georgia,serif;color:var(--suave)}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Logo de Punch: una «p» minúscula cuyo hueco es el agujero de una perforadora -->
    <symbol id="logoPunch" viewBox="0 0 64 64">
      <g transform="translate(1 -5)" fill="currentColor">
        <rect x="16" y="20" width="9" height="36" rx="4.5"/>
        <circle cx="34" cy="31" r="12.5" fill="none" stroke="currentColor" stroke-width="9"/>
      </g>
    </symbol>
  </defs>
</svg>
<div class="orbes" aria-hidden="true"><i></i><i></i><i></i></div>

<main>
  <div class="cab" id="cab"><span class="nombre" id="nombreNegocio">Cargando…</span></div>

  <div id="contenido" hidden style="display:flex;flex-direction:column;gap:18px">
    <div class="hero">
      <h1 id="titulo">Tu tarjeta de sellos</h1>
      <p class="sub" id="subtitulo"></p>
    </div>

    <div class="tarjeta" aria-hidden="true">
      <div class="tit"><span id="tarjetaMarca"></span><span class="contador" id="contador"></span></div>
      <img id="franja" alt="">
      <div class="pie">
        <div><div class="k">Programa</div><div class="v" id="programa"></div></div>
        <div><div class="k" id="kPremio">Premio</div><div class="v" id="premio"></div></div>
      </div>
    </div>

    <div class="aviso vidrio" id="avisoNavegador" hidden></div>

    <form class="formulario vidrio" id="form" novalidate>
      <label class="campo" for="nombre">Tu nombre
        <input id="nombre" type="text" autocomplete="given-name" maxlength="40" placeholder="Por ejemplo, Lucía" required>
      </label>
      <label class="campo" for="telefono">Teléfono <small>Opcional: si cambias de móvil, te la pasamos en el local</small>
        <input id="telefono" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" placeholder="612 345 678">
      </label>
      <label class="check" for="acepto">
        <input id="acepto" type="checkbox">
        <span id="textoPrivacidad"></span>
      </label>
      <p class="error" id="error" role="alert"></p>
      <button class="boton apple" type="submit" id="btnApple" data-plataforma="apple" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.6 1.3 10.1.9 1.2 1.9 2.6 3.2 2.5 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.3.8 1.4 0 2.3-1.2 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.8-1.1-2.8-4zM13.9 5.1c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.4-.6 3.1-1.5z"/></svg>
        Añadir a Apple Wallet
      </button>
      <button class="boton google" type="submit" id="btnGoogle" data-plataforma="google" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M3 7.5A3.5 3.5 0 0 1 6.5 4h11A3.5 3.5 0 0 1 21 7.5V9H3z"/><path fill="#34A853" d="M3 9h18v3H3z"/><path fill="#FBBC04" d="M3 12h18v3H3z"/><path fill="#EA4335" d="M3 15h18v1.5A3.5 3.5 0 0 1 17.5 20h-11A3.5 3.5 0 0 1 3 16.5z"/></svg>
        Guardar en Google Wallet
      </button>
      <p class="aviso" id="avisoEscritorio" hidden style="padding:0">Esta página está pensada para el móvil. Escanea el QR del local con tu teléfono para guardar la tarjeta en su cartera.</p>
    </form>

    <div class="listo vidrio" id="listo" hidden aria-live="polite">
      <div class="cartera" aria-hidden="true"><span class="c"></span><span class="w"></span></div>
      <strong>¡Ya casi está!</strong>
      <span id="textoListo"></span>
    </div>
  </div>

  <p class="aviso vidrio" id="enlaceMalo" hidden>Este enlace no es válido. Vuelve a escanear el QR del local o pide ayuda en el mostrador.</p>

  <div class="conpunch" aria-label="Tarjetas de sellos con Punch"><span>con</span><svg aria-hidden="true"><use href="#logoPunch"/></svg><b>punch</b></div>
</main>
<script>
  const API = "https://pifswbumwcuqpvneqtbh.supabase.co/functions/v1";
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const slug = q.get("n") || "", codigo = q.get("c") || "";
  const ua = navigator.userAgent;
  const esAndroid = /android/i.test(ua);
  const esIOS = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  const enApp = /instagram|fban|fbav|fb_iab|line\/|tiktok/i.test(ua);

  // ¿El fondo del negocio es claro? Entonces el vidrio pasa a versión clara.
  function esClaro(rgb) {
    const m = String(rgb).match(/(\d+)\D+(\d+)\D+(\d+)/);
    if (!m) return false;
    const [r, g, b] = m.slice(1).map(Number);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 160;
  }

  async function cargar() {
    if (!/^[a-z0-9-]{2,40}$/.test(slug) || !codigo) return malo();
    let n;
    try {
      const r = await fetch(`${API}/crear-tarjeta?negocio=${encodeURIComponent(slug)}&codigo=${encodeURIComponent(codigo)}&info=1`);
      if (!r.ok) return malo();
      n = await r.json();
    } catch { return malo(); }

    const raiz = document.documentElement;
    raiz.style.setProperty("--fondo", n.color_fondo);
    raiz.style.setProperty("--texto", n.color_texto);
    raiz.style.setProperty("--acento", n.color_etiquetas);
    raiz.style.setProperty("--fondo-tarjeta", n.color_fondo);
    raiz.style.setProperty("--texto-tarjeta", n.color_texto);
    if (esClaro(n.color_fondo)) raiz.classList.add("claro");
    document.title = `Tarjeta de sellos · ${n.nombre}`;

    const logo = `${API}/imagen/${n.imagenes}/logo@3x.png`;
    const cab = $("cab"), marca = $("tarjetaMarca");
    const ponerNombre = (el, cls) => { el.textContent = ""; const s = document.createElement(cls === "nombre" ? "span" : "b"); if (cls) s.className = cls; s.textContent = n.nombre; el.appendChild(s); };
    if (!n.mostrar_nombre) {
      cab.textContent = ""; marca.textContent = "";
      const img = new Image(); img.alt = n.nombre; img.src = logo;
      img.onerror = () => { ponerNombre(cab, "nombre"); ponerNombre(marca, ""); };
      cab.appendChild(img);
      const img2 = new Image(); img2.alt = ""; img2.src = logo; marca.appendChild(img2);
    } else {
      $("nombreNegocio").textContent = n.nombre;
      ponerNombre(marca, "");
    }
    const bono = n.tipo === "bono";
    $("titulo").textContent = bono ? `Tu bono de ${n.unidad_plural}` : "Tu tarjeta de sellos";
    $("subtitulo").textContent = bono
      ? `Lleva en el móvil tu bono de ${n.visitas_para_premio} ${n.unidad_plural}. En cada visita te descontamos una y verás cuántas te quedan.`
      : `Cada ${n.visitas_para_premio} ${n.unidad_plural}, ${String(n.premio).toLocaleLowerCase("es")}. Guárdala en la cartera del móvil y te la sellamos en cada visita.`;
    $("franja").src = n.franja;
    $("contador").textContent = bono ? `Te quedan ${n.visitas_para_premio}` : `Sellos 0/${n.visitas_para_premio}`;
    $("kPremio").textContent = bono ? "Bono" : "Premio";
    $("programa").textContent = n.programa;
    $("premio").textContent = bono ? `${n.visitas_para_premio} ${n.unidad_plural}` : n.premio;
    $("textoPrivacidad").textContent = `Acepto que ${n.nombre} guarde mi nombre y, si lo indico, mi teléfono solo para gestionar mi ${n.tipo === "bono" ? "bono" : "tarjeta de sellos"}. No se usan para publicidad y puedo pedir que se borren en el local. `;
    const enlace = document.createElement("a"); enlace.href = "privacidad.html"; enlace.target = "_blank"; enlace.rel = "noopener"; enlace.textContent = "Política de privacidad"; enlace.style.color = "inherit";
    $("textoPrivacidad").appendChild(enlace);

    if (esIOS) $("btnApple").hidden = false;
    else if (esAndroid) $("btnGoogle").hidden = false;
    else { $("btnApple").hidden = false; $("btnGoogle").hidden = false; $("avisoEscritorio").hidden = false; }

    if (enApp) {
      const a = $("avisoNavegador"); a.hidden = false;
      a.textContent = esIOS
        ? "Estás dentro de otra app. Para guardar la tarjeta, abre esta página en Safari: toca los tres puntos (…) y elige «Abrir en el navegador»."
        : "Estás dentro de otra app. Para guardar la tarjeta, abre esta página en Chrome: toca los tres puntos (⋮) y elige «Abrir en el navegador».";
    }
    $("contenido").hidden = false;
  }

  function malo() { $("nombreNegocio").textContent = ""; $("enlaceMalo").hidden = false; }

  $("form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const boton = ev.submitter || (esAndroid ? $("btnGoogle") : $("btnApple"));
    const nombre = $("nombre").value.trim().replace(/\s+/g, " ");
    const telefono = $("telefono").value.replace(/[\s().-]/g, "");
    const err = $("error");
    if (!nombre) { err.textContent = "Escribe tu nombre."; $("nombre").focus(); return; }
    if (telefono && !/^\+?[0-9]{6,15}$/.test(telefono)) { err.textContent = "El teléfono no parece correcto. Escribe solo números, por ejemplo 612345678."; $("telefono").focus(); return; }
    if (!$("acepto").checked) { err.textContent = "Para crear la tarjeta, marca la casilla de privacidad."; return; }
    err.textContent = "";

    const plataforma = boton.dataset.plataforma;
    const p = new URLSearchParams({ negocio: slug, codigo, nombre, acepto: "1", plataforma });
    if (telefono) p.set("telefono", telefono);
    document.querySelectorAll(".boton").forEach((b) => (b.disabled = true));
    $("form").hidden = true; $("listo").hidden = false;
    $("textoListo").textContent = plataforma === "apple"
      ? "Se está abriendo tu tarjeta. Pulsa «Añadir», arriba a la derecha, para guardarla en Wallet."
      : "Se está abriendo Google Wallet. Pulsa «Guardar» para añadir tu tarjeta.";
    setTimeout(() => { location.href = `${API}/crear-tarjeta?${p}`; }, 700);
  });

  cargar();
</script>
</body>
</html>
