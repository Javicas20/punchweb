<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tu tarjeta de sellos</title>
<meta name="robots" content="noindex">
<style>
  /* Los colores llegan del negocio (negocios.color_*) y se aplican al cargar */
  :root{--fondo:#16141f;--texto:#ffffff;--acento:#8f7bff;--superficie:rgba(255,255,255,.07);--borde:rgba(255,255,255,.18);--error:#ff8a80}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:440px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:grid;gap:20px}
  .cab{display:flex;align-items:center;gap:10px;min-height:48px}
  .cab img{height:44px;max-width:180px;object-fit:contain}
  .cab .nombre{font-size:22px;font-weight:700;letter-spacing:.01em}
  h1{font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
  .sub{margin:-8px 0 0;opacity:.8}
  .tarjeta{border-radius:16px;overflow:hidden;border:1px solid var(--borde);background:var(--fondo);box-shadow:0 14px 36px rgba(0,0,0,.35)}
  .tarjeta img{display:block;width:100%;height:auto}
  .tarjeta .pie{display:flex;justify-content:space-between;gap:12px;padding:12px 14px}
  .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--acento)}
  .v{font-size:16px;font-weight:500}
  .pie div:last-child{text-align:right}
  form{display:grid;gap:14px}
  label.campo{display:grid;gap:6px;font-weight:600;font-size:15px}
  label.campo small{font-weight:400;opacity:.75}
  input[type=text],input[type=tel]{font:inherit;color:var(--texto);background:var(--superficie);border:1px solid var(--borde);border-radius:12px;padding:13px 14px;width:100%;font-weight:400}
  input::placeholder{color:var(--texto);opacity:.45}
  input:focus-visible,button:focus-visible,.check input:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;opacity:.92}
  .check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--acento)}
  .boton{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;padding:15px 16px;font:600 17px/1.2 inherit;font-family:inherit;cursor:pointer}
  .boton svg{width:22px;height:22px;flex:none}
  .apple{background:#000;color:#fff;border:1px solid rgba(255,255,255,.25)}
  .google{background:#fff;color:#1f1f1f}
  .boton:disabled{opacity:.55;cursor:default}
  .aviso{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--superficie);border:1px solid var(--borde)}
  .error{color:var(--error);font-size:14px;min-height:1.2em;margin:0}
  .listo{text-align:center;display:grid;gap:8px;padding:8px 0}
  .listo strong{font-size:20px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="cab" id="cab"><span class="nombre" id="nombreNegocio">Cargando…</span></div>

  <section id="contenido" hidden>
    <div style="display:grid;gap:20px">
      <h1 id="titulo">Consigue tu tarjeta de sellos</h1>
      <p class="sub" id="subtitulo"></p>

      <div class="tarjeta" aria-hidden="true">
        <img id="franja" alt="">
        <div class="pie">
          <div><div class="k">Programa</div><div class="v" id="programa"></div></div>
          <div><div class="k">Premio</div><div class="v" id="premio"></div></div>
        </div>
      </div>

      <div class="aviso" id="avisoNavegador" hidden></div>

      <form id="form" novalidate>
        <label class="campo" for="nombre">Tu nombre
          <input id="nombre" type="text" autocomplete="given-name" maxlength="40" placeholder="Por ejemplo, Lucía" required>
        </label>
        <label class="campo" for="telefono">Teléfono <small>(opcional: para recuperar tu tarjeta si cambias de móvil)</small>
          <input id="telefono" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" placeholder="612 345 678">
        </label>
        <label class="check" for="acepto">
          <input id="acepto" type="checkbox">
          <span id="textoPrivacidad"></span>
        </label>
        <p class="error" id="error" role="alert"></p>
        <button class="boton apple" type="submit" id="btnApple" data-plataforma="apple" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.6 1.3 10.1.9 1.2 1.9 2.6 3.2 2.5 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.3.8 1.4 0 2.3-1.2 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.8-1.1-2.8-4zM13.9 5.1c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.4-.6 3.1-1.5z"/></svg>
          Añadir a Apple Wallet
        </button>
        <button class="boton google" type="submit" id="btnGoogle" data-plataforma="google" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M3 7.5A3.5 3.5 0 0 1 6.5 4h11A3.5 3.5 0 0 1 21 7.5V9H3z"/><path fill="#34A853" d="M3 9h18v3H3z"/><path fill="#FBBC04" d="M3 12h18v3H3z"/><path fill="#EA4335" d="M3 15h18v1.5A3.5 3.5 0 0 1 17.5 20h-11A3.5 3.5 0 0 1 3 16.5z"/></svg>
          Guardar en Google Wallet
        </button>
        <p class="aviso" id="avisoEscritorio" hidden>Esta página está pensada para el móvil. Escanea el QR del local con tu teléfono para guardar la tarjeta en su cartera.</p>
      </form>

      <div class="listo" id="listo" hidden>
        <strong>¡Ya casi está!</strong>
        <span id="textoListo"></span>
      </div>
    </div>
  </section>

  <p class="aviso" id="enlaceMalo" hidden>Este enlace no es válido. Vuelve a escanear el QR del local o pide ayuda en el mostrador.</p>
</main>
<script>
  const API = "https://pifswbumwcuqpvneqtbh.supabase.co/functions/v1";
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const slug = q.get("n") || "", codigo = q.get("c") || "";
  const ua = navigator.userAgent;
  const esAndroid = /android/i.test(ua);
  const esIOS = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  const enApp = /instagram|fban|fbav|fb_iab|line\/|tiktok/i.test(ua);

  async function cargar() {
    if (!/^[a-z0-9-]{2,40}$/.test(slug) || !codigo) return malo();
    let n;
    try {
      const r = await fetch(`${API}/crear-tarjeta?negocio=${encodeURIComponent(slug)}&codigo=${encodeURIComponent(codigo)}&info=1`);
      if (!r.ok) return malo();
      n = await r.json();
    } catch { return malo(); }

    const raiz = document.documentElement.style;
    raiz.setProperty("--fondo", n.color_fondo);
    raiz.setProperty("--texto", n.color_texto);
    raiz.setProperty("--acento", n.color_etiquetas);
    document.title = `Tarjeta de sellos · ${n.nombre}`;

    const cab = $("cab");
    if (!n.mostrar_nombre) {
      cab.textContent = "";
      const img = new Image(); img.alt = n.nombre; img.src = `${API}/imagen/${n.imagenes}/logo@3x.png`;
      img.onerror = () => { cab.textContent = ""; const s = document.createElement("span"); s.className = "nombre"; s.textContent = n.nombre; cab.appendChild(s); };
      cab.appendChild(img);
    } else {
      $("nombreNegocio").textContent = n.nombre;
    }
    $("subtitulo").textContent = `Cada ${n.visitas_para_premio} ${n.unidad_plural}, ${n.premio.toLocaleLowerCase("es")}. La guardas en la cartera del móvil y te la sellamos en cada visita.`;
    $("franja").src = `${API}/imagen/${n.imagenes}/strip-0@3x.png`;
    $("programa").textContent = n.programa;
    $("premio").textContent = n.premio;
    $("textoPrivacidad").textContent = `Acepto que ${n.nombre} guarde mi nombre y, si lo indico, mi teléfono solo para gestionar mi tarjeta de sellos. No se usan para publicidad y puedo pedir que se borren en el local.`;

    if (esIOS) $("btnApple").hidden = false;
    else if (esAndroid) $("btnGoogle").hidden = false;
    else { $("btnApple").hidden = false; $("btnGoogle").hidden = false; $("avisoEscritorio").hidden = false; }

    if (enApp) {
      const a = $("avisoNavegador"); a.hidden = false;
      a.textContent = esIOS
        ? "Estás dentro de otra app. Para guardar la tarjeta, abre esta página en Safari: toca los tres puntos (…) y elige «Abrir en el navegador»."
        : "Estás dentro de otra app. Para guardar la tarjeta, abre esta página en Chrome: toca los tres puntos (⋮) y elige «Abrir en el navegador».";
    }
    $("contenido").hidden = false;
  }

  function malo() { $("nombreNegocio").textContent = ""; $("enlaceMalo").hidden = false; }

  $("form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const boton = ev.submitter || (esAndroid ? $("btnGoogle") : $("btnApple"));
    const nombre = $("nombre").value.trim().replace(/\s+/g, " ");
    const telefono = $("telefono").value.replace(/[\s().-]/g, "");
    const err = $("error");
    if (!nombre) { err.textContent = "Escribe tu nombre."; $("nombre").focus(); return; }
    if (telefono && !/^\+?[0-9]{6,15}$/.test(telefono)) { err.textContent = "El teléfono no parece correcto. Escribe solo números, por ejemplo 612345678."; $("telefono").focus(); return; }
    if (!$("acepto").checked) { err.textContent = "Para crear la tarjeta, marca la casilla de privacidad."; return; }
    err.textContent = "";

    const plataforma = boton.dataset.plataforma;
    const p = new URLSearchParams({ negocio: slug, codigo, nombre, acepto: "1", plataforma });
    if (telefono) p.set("telefono", telefono);
    document.querySelectorAll(".boton").forEach((b) => (b.disabled = true));
    $("form").hidden = true; $("listo").hidden = false;
    $("textoListo").textContent = plataforma === "apple"
      ? "Se está abriendo tu tarjeta. Pulsa «Añadir», arriba a la derecha, para guardarla en Wallet."
      : "Se está abriendo Google Wallet. Pulsa «Guardar» para añadir tu tarjeta.";
    location.href = `${API}/crear-tarjeta?${p}`;
  });

  cargar();
</script>
</body>
</html>
